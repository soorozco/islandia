<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-f616c0fc-2f19-4ca9-b4bb-2a0de125aa29/styles.css">
</helmet>
<div ref="{{ rootRef }}" style="padding:18px 20px 20px">
  <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">
    <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--p-ice,#8fdfef)">{{ label }}</div>
    <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--p-dim,#6f96a8);margin-left:auto">{{ sub }}</div>
  </div>
  <div style="display:flex;gap:4px;align-items:stretch">
    <sc-for list="{{ cells }}" as="cell" hint-placeholder-count="8">
      <div style="position:relative;width:{{ cell.w }};height:46px;background:{{ cell.bg }};border:1px solid {{ cell.bd }};perspective:170px;overflow:hidden;flex:none">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1;color:var(--p-fg,#eaf7fb);font-variant-numeric:tabular-nums">{{ cell.ch }}</div>
        <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:var(--p-bg,#05101b);opacity:.8"></div>
        <div data-leaf="{{ cell.i }}" style="position:absolute;left:0;right:0;top:0;height:50%;overflow:hidden;background:var(--p-card,#0a1a26);transform-origin:bottom center;backface-visibility:hidden;opacity:0">
          <div data-old="1" style="position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1;color:var(--p-fg,#eaf7fb);font-variant-numeric:tabular-nums"></div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:12px;font-size:11px;letter-spacing:.1em;color:var(--p-dim,#6f96a8)">{{ note }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:140},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;14:32:07&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Guadalajara&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;UTC−6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;casa&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();

  componentDidUpdate(prevProps) {
    if (prevProps.value === this.props.value) return;
    const root = this.rootRef.current;
    if (!root) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const v = String(this.props.value ?? "");
    const p = String(prevProps.value ?? "");
    v.split("").forEach((ch, i) => {
      const old = p[i];
      if (old === undefined || old === ch || ch === ":" ) return;
      const leaf = root.querySelector('[data-leaf="' + i + '"]');
      if (!leaf) return;
      const face = leaf.querySelector("[data-old]");
      if (face) face.textContent = old;
      leaf.style.opacity = "1";
      const a = leaf.animate(
        [{ transform: "rotateX(0deg)" }, { transform: "rotateX(-90deg)" }],
        { duration: 260, easing: "cubic-bezier(.5,0,.9,.6)" }
      );
      const hide = () => { leaf.style.opacity = "0"; };
      a.onfinish = hide;
      a.oncancel = hide;
      setTimeout(hide, 300);
    });
  }

  renderVals() {
    const v = String(this.props.value ?? "--:--:--");
    const cells = v.split("").map((ch, i) => {
      const sep = ch === ":" || ch === ".";
      return {
        i, ch,
        w: sep ? "14px" : "32px",
        bg: sep ? "transparent" : "var(--p-card,#0a1a26)",
        bd: sep ? "transparent" : "var(--p-line,#1c3b4d)"
      };
    });
    return {
      cells, rootRef: this.rootRef,
      label: this.props.label ?? "", sub: this.props.sub ?? "", note: this.props.note ?? ""
    };
  }
}
</script>
</body>
</html>
