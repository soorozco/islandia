<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-f616c0fc-2f19-4ca9-b4bb-2a0de125aa29/styles.css">
</helmet>
<div style="padding:26px;font-family:var(--font-body)">
  <h4 style="margin:0;font-size:20px;letter-spacing:-.02em">{{ title }}</h4>
  <div style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin:6px 0 16px">{{ sub }}</div>
  <sc-for list="{{ items }}" as="row" hint-placeholder-count="6">
    <div onClick="{{ row.toggle }}" style="display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:15px">
      <span style="width:18px;height:18px;flex:none;margin-top:3px;border:1.5px solid var(--color-neutral-500);color:var(--color-bg);font-size:12px;line-height:15px;text-align:center;background:{{ row.bg }};border-color:{{ row.bg2 }}">{{ row.mark }}</span>
      <span style="color:{{ row.color }};text-decoration:{{ row.deco }}">{{ row.label }}</span>
    </div>
  </sc-for>
  <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--color-divider);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent)">{{ progress }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:320},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ropa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Por capas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0 de 6 listos&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
